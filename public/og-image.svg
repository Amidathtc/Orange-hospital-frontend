  </text>

  <text x="380" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="28" fill="#E8ECE9">
    Daily &amp; Weekly Healthcare Savings Scheme
  </text>

  <text x="380" y="425" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#A4C2B8">
    • Full Medical Coverage at Orange Hospital
  </text>
  <text x="380" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#A4C2B8">
    • Flexible Emergency Cash Draw Returns
  </text>

  <!-- Verified Badge -->
  <g transform="translate(380, 500)">
    <rect width="360" height="42" rx="21" fill="#16382C" stroke="#52B848" stroke-width="1.5" />
    <text x="30" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">
      🔒 Secure Micro-Savings &amp; Healthcare
    </text>
